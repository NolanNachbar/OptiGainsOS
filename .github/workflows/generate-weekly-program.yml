name: Generate Weekly Program

on:
  # Run every Sunday at 11pm MT (05:00 UTC Monday) — programs the following week
  schedule:
    - cron: "0 5 * * 1"
  # Manual trigger — run anytime to program remaining days of current week
  workflow_dispatch:
    inputs:
      days_ahead:
        description: "Number of days to generate (0 = rest of this week)"
        required: false
        default: "0"
  # Fired from the app when a programmed day is overridden by hand: the rest of
  # the week reflows around the swap. The locked date itself is skipped by the
  # generator, so the override survives the run it triggers.
  repository_dispatch:
    types: [regenerate-week]

permissions:
  contents: read

jobs:
  # Gate: the engine's behavioral checks must pass before the generator writes to
  # the production database.
  validate:
    name: Validate Engine
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install python-dotenv numpy "scipy>=1.11"

      # Must run with scripts/ as the cwd: the script importlib-loads
      # "generate_weekly_program.py" by RELATIVE path, which resolves against the
      # cwd (not the script dir), so it exits 1 when invoked from the repo root.
      #
      # The Supabase vars are deliberate placeholders, NOT secrets. Importing
      # generate_weekly_program.py runs a module-level guard that hard-exits when
      # they are unset; nothing here touches the network, and the checks are pure
      # engine functions.
      - name: Run convergence validation
        working-directory: scripts
        env:
          SUPABASE_URL: "https://placeholder.invalid"
          SUPABASE_SERVICE_ROLE_KEY: "placeholder-not-a-real-key"
        run: python3 validate_convergence_fixes.py

  generate:
    name: Generate Program Workouts
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install python-dotenv numpy "scipy>=1.11"

      - name: Generate weekly program
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          USER_ID: ${{ secrets.USER_ID }}
          DAYS_AHEAD: ${{ github.event.inputs.days_ahead || '0' }}
        run: python scripts/generate_weekly_program.py

  # A weekly cron that dies is invisible until the schedule is already wrong.
  # Surface every failure as a GitHub issue.
  alert:
    name: Alert on Failure
    if: failure()
    needs: [validate, generate]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Open or update the failure issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TITLE: "Generate Weekly Program failed"
          RUN_URL: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          R_VALIDATE: ${{ needs.validate.result }}
          R_GENERATE: ${{ needs.generate.result }}
        run: |
          set -uo pipefail

          BODY=$(cat <<EOF
          The **Generate Weekly Program** workflow failed on $(date -u '+%Y-%m-%d %H:%M UTC').

          [View the failed run]($RUN_URL)

          | job | result |
          | --- | --- |
          | validate | \`$R_VALIDATE\` |
          | generate | \`$R_GENERATE\` |

          - A failed **validate** means the engine checks did not pass and the
            production database write was correctly blocked. Fix the engine.
          - A failed **generate** means next week's program may be missing or
            partially written. Re-run via workflow_dispatch once fixed.
          EOF
          )

          gh label create engine-failure --color B60205 \
            --description "Automated engine / CI failure" --force >/dev/null 2>&1 || true

          EXISTING=$(gh issue list --state open --label engine-failure --json number,title \
            --jq "[.[] | select(.title == \"$TITLE\")] | .[0].number // empty" 2>/dev/null || true)

          if [ -n "${EXISTING:-}" ]; then
            echo "Commenting on existing issue #$EXISTING"
            gh issue comment "$EXISTING" --body "$BODY"
          else
            echo "Opening a new failure issue"
            gh issue create --title "$TITLE" --body "$BODY" --label engine-failure \
              || gh issue create --title "$TITLE" --body "$BODY"
          fi
