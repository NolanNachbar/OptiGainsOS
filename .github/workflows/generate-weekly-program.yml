name: Generate Weekly Program

on:
  # Run every Sunday at 11pm MT (05:00 UTC Monday) — programs the following week
  schedule:
    - cron: "0 5 * * 1"
  # Manual trigger — run anytime to program remaining days of current week
  workflow_dispatch:
    inputs:
      days_ahead:
        description: "Number of days to generate (0 = rest of this week)"
        required: false
        default: "0"

jobs:
  generate:
    name: Generate Program Workouts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install python-dotenv numpy

      - name: Generate weekly program
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DAYS_AHEAD: ${{ github.event.inputs.days_ahead || '0' }}
          # Read-only template source — Bench Everyday Peaking Phase (intact templates).
          # Generated workouts are written to the active enrollment's program only.
          TEMPLATE_PROGRAM_ID: "8fc04901-6033-41ad-92b6-24191501d9e3"
        run: python scripts/generate_weekly_program.py
