name: Tests

# Gate engine changes BEFORE they reach main and get picked up by the scheduled
# workflows that write to the production database.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validate Engine
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install python-dotenv numpy "scipy>=1.11"

      # Must run with scripts/ as the cwd: the script importlib-loads
      # "generate_weekly_program.py" by RELATIVE path, which resolves against the
      # cwd (not the script dir), so it exits 1 when invoked from the repo root.
      #
      # The Supabase vars are deliberate placeholders, NOT secrets. Importing
      # generate_weekly_program.py runs a module-level guard that hard-exits when
      # they are unset; nothing here touches the network, and the checks are pure
      # engine functions. Using fakes keeps this job runnable on fork PRs, which
      # never receive repository secrets.
      - name: Run convergence validation
        working-directory: scripts
        env:
          SUPABASE_URL: "https://placeholder.invalid"
          SUPABASE_SERVICE_ROLE_KEY: "placeholder-not-a-real-key"
        run: python3 validate_convergence_fixes.py

  # A red X on a PR is already visible, but a broken push to main is not — and main
  # is what the daily cron runs. Only alert for main: fork PRs get a read-only
  # GITHUB_TOKEN and could not open an issue anyway.
  alert:
    name: Alert on Failure
    if: failure() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [validate]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Open or update the failure issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TITLE: "Engine tests failing on main"
          RUN_URL: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          SHA: ${{ github.sha }}
        run: |
          set -uo pipefail

          BODY=$(cat <<EOF
          The engine validation checks are **failing on \`main\`** as of $(date -u '+%Y-%m-%d %H:%M UTC').

          Commit: \`$SHA\`
          [View the failed run]($RUN_URL)

          The scheduled **Daily Engine** and **Generate Weekly Program** workflows run
          from \`main\` and gate their database writes on these same checks, so they
          will now refuse to write until this is fixed. Today's engine state will go
          stale until then.
          EOF
          )

          gh label create engine-failure --color B60205 \
            --description "Automated engine / CI failure" --force >/dev/null 2>&1 || true

          EXISTING=$(gh issue list --state open --label engine-failure --json number,title \
            --jq "[.[] | select(.title == \"$TITLE\")] | .[0].number // empty" 2>/dev/null || true)

          if [ -n "${EXISTING:-}" ]; then
            echo "Commenting on existing issue #$EXISTING"
            gh issue comment "$EXISTING" --body "$BODY"
          else
            echo "Opening a new failure issue"
            gh issue create --title "$TITLE" --body "$BODY" --label engine-failure \
              || gh issue create --title "$TITLE" --body "$BODY"
          fi
