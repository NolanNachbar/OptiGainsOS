<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Vektor</title>
    <script>
      // GitHub Pages SPA redirect
      // This script takes the current URL and redirects to the root with the path as a hash
      var pathSegmentsToKeep = 1; // GitHub Pages project site at /VektorPub/

      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body>
  </body>
</html>
